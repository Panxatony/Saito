name: Static Analysis

on:
  pull_request:
  push:
    branches: [ main, develop, 8.4.x ]
  # A push only gets one chance at creating a run. During the Actions outage on
  # 2026-08-06 two pushes to develop produced no run at all — not queued, not
  # failed, simply absent — and the only ways back were a second push or an
  # empty commit, both of which put noise in the history to work around a fault
  # somewhere else entirely. This makes the workflow re-runnable by hand on any
  # ref, which is also what you want when a run failed for a reason that has
  # since been fixed outside the repository.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpstan:
    runs-on: ubuntu-latest
    container: php:8.5-cli-trixie
    # No database here, deliberately. Static analysis has no business touching
    # one, and tests/bootstrap.php — which phpstan.neon loads — now returns
    # before its migration block unless it is genuinely a PHPUnit run.
    #
    # Leaving the service in place made that rule unenforceable: the block ran
    # under PHPStan for as long as it happened to load the file in one worker at
    # a time, and PHPStan 2.2.11 stopped happening to (PR #108, 2026-09-03).
    # Without a database the next attempt to connect from here fails loudly and
    # at once, instead of racing quietly until a version bump changes the timing.
    env:
      COMPOSER_ALLOW_SUPERUSER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system + PHP extensions
        run: |
          apt-get update -qq
          apt-get install -y -qq -o Acquire::Retries=3 --no-install-recommends \
            git zip unzip libicu-dev libpng-dev libjpeg-dev libwebp-dev \
            libonig-dev
          docker-php-ext-configure gd --with-jpeg --with-webp
          docker-php-ext-install -j"$(nproc)" pdo_mysql gd intl mbstring exif
          # Composer pinned and checked (#172): this is the job that builds
          # the release artifact (or one like it). Not `installer | php`.
          curl -fsSL -o /usr/local/bin/composer https://getcomposer.org/download/2.10.3/composer.phar
          echo "7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6  /usr/local/bin/composer" | sha256sum -c -
          chmod +x /usr/local/bin/composer

      - name: composer install
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=2G

      # A key with no msgid renders as itself on the page: `__('user.block.t')`
      # printed the literal string `user.block.t` as the label of the
      # block-duration select for as long as blocking lived on the profile, and
      # it took a user to notice. Nothing failed and nothing logged, because from
      # the code's side everything worked. Runs in about a second.
      - name: Translation keys are declared
        run: php dev/check-translations.php

  frontend:
    # The type-checker and the linter. `tsconfig.json` has had `strict: true` for
    # years and nothing ever ran against it: vite builds with esbuild, which
    # strips types without looking at them, so the strictness was enforced only
    # by whichever editor happened to be open. The first run found seven errors
    # in shipped code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: yarn install
        run: |
          npm install -g --loglevel=error yarn@1.22.22
          yarn install --frozen-lockfile --non-interactive --no-progress

      - name: Type-check and lint
        run: npm run lint
