name: Release

# Tag-driven releases (mirrors the GitLab CI release pipeline). Push an
# annotated version tag on main — `git tag -a 7.0.6 -m 'Saito 7.0.6' && git push
# github 7.0.6` — to run the tests, build the deployable tarball and publish a
# GitHub Release with the tarball + checksum as assets.
#
# Annotated, with `-a`: this line said plain `git tag` until 8.4.4 and the whole
# series before it was annotated anyway, so following the documentation was what
# broke the pattern. `git describe` skips lightweight tags unless given --tags.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  # A tag push gets one chance at creating a run, and during the Actions outage
  # on 2026-08-06 the tag for 8.4.3 produced none at all — pushed, accepted, and
  # no run: no tarball, no release, nothing to deploy production from. The only
  # way back was to delete the remote tag and push it again, which is a strange
  # thing to have to do to a tag that was already correct.
  #
  # Dispatch this against the **tag**, not a branch (`gh workflow run release.yml
  # --ref 8.4.3`): every job reads GITHUB_REF_NAME as the version. Given a branch
  # the `changelog` job fails within seconds, which is the right way for that
  # mistake to end.
  workflow_dispatch:

# Only first-party actions (actions/*) plus the pre-installed `gh` CLI are
# used here, so nothing third-party runs in the job that builds and signs a
# release. (security-audit.yml does use one, pinned to a commit.)
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------
  # Is this release described? Everything else about a release happens by
  # itself — the version, the tag, the tarball — but the description does
  # not, and nothing noticed when it was missing: the release job below
  # falls back to the bare version string as its own notes. 8.2.2, 8.2.3
  # and 8.2.4 were published that way, and 8.0.12/8.0.13 before them.
  #
  # A job of its own so it fails in seconds rather than after the suite and
  # the build, and because a missing CHANGELOG section is worth fixing
  # before anything is published, not after.
  # --------------------------------------------------------------------
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: CHANGELOG describes this version
        run: sh dev/check-changelog.sh "${GITHUB_REF_NAME}"

  # --------------------------------------------------------------------
  # Run the PHPUnit suite against MariaDB before building a release.
  # --------------------------------------------------------------------
  test:
    needs: changelog
    runs-on: ubuntu-latest
    container: php:8.4-cli-trixie
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: saito_test
          MARIADB_USER: saito
          MARIADB_PASSWORD: saito
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_TEST_URL: "mysql://saito:saito@mariadb/saito_test?encoding=utf8mb4&timezone=UTC"
      COMPOSER_ALLOW_SUPERUSER: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install system + PHP extensions
        run: |
          apt-get update -qq
          apt-get install -y -qq -o Acquire::Retries=3 --no-install-recommends \
            git zip unzip libicu-dev libpng-dev libjpeg-dev libwebp-dev \
            libonig-dev default-mysql-client
          docker-php-ext-configure gd --with-jpeg --with-webp
          docker-php-ext-install -j"$(nproc)" pdo_mysql gd intl mbstring exif
          curl -sS https://getcomposer.org/installer | php -- \
            --install-dir=/usr/local/bin --filename=composer

      - name: composer install
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Wait for MariaDB
        run: until mysql -h mariadb -u saito -psaito saito_test -e "SELECT 1" >/dev/null 2>&1; do sleep 1; done

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=never

  # --------------------------------------------------------------------
  # Build the deployable tarball (PHP prod deps + compiled frontend
  # assets) and its checksum. Blocks on a dependency CVE (composer audit).
  # --------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    container: php:8.4-cli-trixie
    env:
      COMPOSER_ALLOW_SUPERUSER: "1"
    steps:
      - uses: actions/checkout@v7

      # composer install (post-install) rewrites the __SALT__ placeholders in
      # config/app.php with a random salt. Keep the committed placeholder so the
      # installer regenerates a fresh salt on the first deploy — save it now and
      # restore it before packaging (git isn't available for a `git checkout`:
      # this job runs in a container without git at checkout time, so the repo
      # arrives as an API tarball with no .git directory).
      - name: Preserve committed config/app.php
        run: cp config/app.php /tmp/app.php.committed

      - name: Install system + PHP extensions
        run: |
          apt-get update -qq
          apt-get install -y -qq -o Acquire::Retries=3 --no-install-recommends \
            git zip unzip ca-certificates curl gnupg \
            libicu-dev libpng-dev libjpeg-dev libwebp-dev libonig-dev
          docker-php-ext-configure gd --with-jpeg --with-webp
          docker-php-ext-install -j"$(nproc)" pdo_mysql gd intl mbstring exif
          curl -sS https://getcomposer.org/installer | php -- \
            --install-dir=/usr/local/bin --filename=composer

      - name: Security gate — known CVEs in dependencies
        # --locked audits composer.lock directly (honouring the
        # config.audit.ignore entries) without needing an installed vendor/
        # tree, so it works on a clean CI checkout. --no-dev scopes the audit
        # to the production dependency set — exactly what the tarball below
        # ships via `composer install --no-dev`. Dev-only tooling (phpunit,
        # composer/composer, psalm, …) never reaches the artifact, so a CVE in
        # those must not block the release; keep dev tooling current separately.
        run: composer audit --locked --no-dev

      - name: composer install (production only)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      # Debian 13 ships Node 20, and the build tooling requires >= 22.11 —
      # `yarn install` refuses below that with an engine error naming cssnano.
      # So the version comes from upstream rather than from apt, and from
      # .nvmrc rather than a number repeated here: one place to change it, the
      # same one the other workflows and a developer's shell read.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Build frontend assets (yarn)
        run: |
          node --version
          npm install -g --silent yarn
          yarn install --frozen-lockfile --non-interactive
          # The release chain is package.json scripts now (no grunt): Sass,
          # PostCSS (autoprefixer + cssnano), purge, the three Vite bundles and
          # the asset copy. Output is byte-identical to the old `grunt release`.
          yarn build:release

      - name: Package tarball
        run: |
          set -eu
          RELEASE_NAME="saito-${GITHUB_REF_NAME}"
          # Restore the committed config/app.php placeholder (see the
          # "Preserve committed config/app.php" step above).
          cp /tmp/app.php.committed config/app.php
          mkdir -p build
          # docs/help is content the application reads at runtime (the help
          # overlay and /help), so it ships; the developer documentation beside
          # it does not. tar lets `*` cross slashes by default, which would take
          # docs/help/*/*.md with it — so that is switched off for that one
          # pattern and straight back on, because `*/tests` further down relies
          # on the default.
          #
          # The exclusion used to be `./docs/*.md`, which took the
          # operator-facing pages with it — and the shipped README links to two
          # of them, so an operator who had only the tarball followed a dead
          # link to the file that says APP_DEFAULT_TIMEZONE must be UTC, the one
          # setting that silently breaks every timestamp in the forum. Naming
          # the developer pages instead is also the safer shape: adding a page
          # for operators now ships it by default, and forgetting to ship one is
          # the failure that goes unnoticed.
          #
          # Naming the wanted files back as operands does not work: GNU tar
          # applies --exclude to explicitly named files too. Tried, and the
          # files were still absent from the archive.
          #
          # These comments live here rather than between the arguments: a `#`
          # line following a trailing backslash comments out the remainder of the
          # command. That swallowed the `.` operand and tar refused to build an
          # empty archive — which is how the first 8.1.0 build died.
          tar czf "build/${RELEASE_NAME}.tar.gz" \
            --transform "s,^,${RELEASE_NAME}/," \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.gitlab-ci.yml' \
            --exclude='./.gitignore' \
            --exclude='./.phpunit.result.cache' \
            --exclude='./build' \
            --exclude='./dev' \
            --exclude='./docs/dev-setup.md' \
            --exclude='./docs/dev-hooks.md' \
            --exclude='./docs/CHANGELOG_OLD.md' \
            --exclude='./docs/local' \
            --exclude='./frontend' \
            --exclude='./node_modules' \
            --exclude='./logs' \
            --exclude='./tmp' \
            --exclude='./tests' \
            --exclude='./pipeline-failed.log' \
            --exclude='./package.json' \
            --exclude='./phpcs.xml.dist' \
            --exclude='./phpstan.neon' \
            --exclude='./phpunit.xml.dist' \
            --exclude='./tsconfig.json' \
            --exclude='./eslint.config.mjs' \
            --exclude='./vite.config.ts' \
            --exclude='./yarn.lock' \
            --exclude='*/tests' \
            .
          # Record the checksum with a bare filename, not `build/…`: whoever
          # downloads the two assets side by side has to be able to run
          # `sha256sum -c <file>.sha256` in the directory they landed in. With
          # the build path baked in, that fails with "No such file or
          # directory" and reads like a corrupted download.
          (cd build && sha256sum "${RELEASE_NAME}.tar.gz" > "${RELEASE_NAME}.tar.gz.sha256")
          ls -lh build/

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-tarball
          path: build/saito-*
          retention-days: 30

  # --------------------------------------------------------------------
  # Publish the GitHub Release with the tarball + checksum as assets and
  # the matching CHANGELOG section as release notes.
  # --------------------------------------------------------------------
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: release-tarball
          path: build

      - name: Extract CHANGELOG section for this version
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}"
          # Pull the "## [<version>] …" block (up to the next "## [") out of the
          # CHANGELOG.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {grab=1; print; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > release-notes.md
          # No fallback. There used to be one — it wrote "Saito <version>" and
          # published, which is how three releases went out with no notes and
          # nobody noticed. The `changelog` job ahead of this one makes an empty
          # file impossible, so reaching this point means something else broke
          # and the release should stop rather than paper over it.
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for ${VERSION} — refusing to publish an undescribed release." >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          PRERELEASE=""
          case "$VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          # Releases carry a name from 8.3.6 on. It lives in the CHANGELOG
          # heading between double quotes -- `## [8.3.6] - 2026-08-01 "waffel"`
          # -- which is the one place describing the release that already has to
          # be right, so the title cannot drift away from the notes.
          #
          # Absent, the title is what it always was. Older tags have no name and
          # must keep publishing.
          TITLE="Saito ${VERSION}"
          NAME=$(sed -n "1s/^## \[[^]]*\].*\"\(.*\)\".*/\1/p" release-notes.md)
          if [ -n "$NAME" ]; then
            TITLE="Saito ${VERSION} \"${NAME}\""
          fi
          gh release create "$VERSION" \
            build/saito-*.tar.gz \
            build/saito-*.tar.gz.sha256 \
            --title "$TITLE" \
            --notes-file release-notes.md \
            $PRERELEASE
