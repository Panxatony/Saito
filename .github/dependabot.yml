# Dependabot: proposes the fix rather than only naming the problem.
#
# Two things run under this name and it is worth keeping them apart:
#
#   * **Security updates** react to an advisory and open a pull request with the
#     smallest version bump that closes it. They need no configuration here —
#     only the switch in the repository settings (Settings → Code security →
#     Dependabot alerts, and Dependabot security updates beneath it). Without
#     that switch this file still works, but you get scheduled updates only and
#     no reaction to advisories.
#   * **Version updates** are what this file schedules: keeping current on
#     purpose rather than after a scare.
#
# The nightly `security-audit` workflow covers what Dependabot cannot: an
# advisory for which no fixed version exists yet produces no pull request, and
# silence would be indistinguishable from safety.
version: 2

updates:
  # ------------------------------------------------------------------
  # PHP. `saito` is what runs on the server, so it is the tree that
  # matters — but the split below is by risk, not by manifest, because
  # composer has both in one file.
  # ------------------------------------------------------------------
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels: [dependencies, php]
    groups:
      # Development tooling moves constantly and never reaches the
      # server: `composer install --no-dev` leaves it out of the release
      # tarball. One pull request a week for the lot of it, so the
      # individual ones are about code that ships.
      php-dev-tooling:
        dependency-type: development
        patterns: ["*"]
    ignore:
      # Held back deliberately, each for a reason recorded in todo.md.
      # Dependabot would otherwise re-propose them every week.
      #  - authentication 4 rewrites the identifier configuration
      #    (250 tests failed when it was tried on 2026-07-30)
      #  - migrations 5 stops the Initial migration creating tables
      #  - php_codesniffer 4 is blocked by cakephp-codesniffer and
      #    slevomat, which both still require ^3
      - dependency-name: cakephp/authentication
        versions: [">=4"]
      - dependency-name: cakephp/migrations
        versions: [">=5"]
      - dependency-name: squizlabs/php_codesniffer
        versions: [">=4"]

  # ------------------------------------------------------------------
  # JavaScript. Six packages reach the browser; everything else is the
  # build. Measured 2026-08-01: 65 advisories in the tree, none of them
  # in those six.
  # ------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    groups:
      # eslint, vite, sass, postcss and their trees. They produce the
      # bundle; they are not in it.
      js-build-tooling:
        dependency-type: development
        patterns: ["*"]
    ignore:
      # Bootstrap 4 is unmaintained and going, but its successor is a
      # rewrite of every template rather than a bump — see todo.md. Its
      # known vulnerabilities are in JavaScript this forum has not loaded
      # since 8.1.0.
      - dependency-name: bootstrap
        versions: [">=5"]

  # ------------------------------------------------------------------
  # The actions themselves. A pinned action with a vulnerability is a
  # vulnerability in the pipeline that builds the release.
  # ------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
