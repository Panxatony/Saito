# Dependabot: proposes the fix rather than only naming the problem.
#
# Two things run under this name and it is worth keeping them apart:
#
#   * **Security updates** react to an advisory and open a pull request with the
#     smallest version bump that closes it. They need no configuration here —
#     only the switch in the repository settings (Settings → Code security →
#     Dependabot alerts, and Dependabot security updates beneath it). Without
#     that switch this file still works, but you get scheduled updates only and
#     no reaction to advisories.
#   * **Version updates** are what this file schedules: keeping current on
#     purpose rather than after a scare.
#
# The nightly `security-audit` workflow covers what Dependabot cannot: an
# advisory for which no fixed version exists yet produces no pull request, and
# silence would be indistinguishable from safety.
version: 2

updates:
  # ------------------------------------------------------------------
  # PHP. `saito` is what runs on the server, so it is the tree that
  # matters — but the split below is by risk, not by manifest, because
  # composer has both in one file.
  # ------------------------------------------------------------------
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels: [dependencies, php]
    groups:
      # Development tooling moves constantly and never reaches the
      # server: `composer install --no-dev` leaves it out of the release
      # tarball. One pull request a week for the lot of it, so the
      # individual ones are about code that ships.
      php-dev-tooling:
        dependency-type: development
        patterns: ["*"]
    ignore:
      # Held back deliberately, each for a reason recorded in issue #66.
      # Dependabot would otherwise re-propose them every week.
      #  - authentication 4 rewrites the identifier configuration
      #    (250 tests failed when it was tried on 2026-07-30)
      #  - migrations 5 stops the Initial migration creating tables
      #
      # php_codesniffer used to be listed here too, waiting on
      # cakephp-codesniffer and slevomat, which both required ^3. They moved to
      # ^4 and the entry turned from a shield into a brake: on 2026-08-31 it was
      # our own `^3` that made Dependabot refuse cakephp-codesniffer 5.3.2.
      # Taken on 2026-09-03 — a held-back dependency needs re-checking, not just
      # recording.
      # reviewed: 2026-09-03
      - dependency-name: cakephp/authentication
        versions: [">=4"]
      # reviewed: 2026-09-03
      - dependency-name: cakephp/migrations
        versions: [">=5"]

  # ------------------------------------------------------------------
  # JavaScript. Six packages reach the browser; everything else is the
  # build. Measured 2026-08-01: 65 advisories in the tree, none of them
  # in those six.
  # ------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    groups:
      # eslint, vite, sass, postcss and their trees. They produce the
      # bundle; they are not in it.
      js-build-tooling:
        dependency-type: development
        patterns: ["*"]
    ignore:
      # Only the next major. The themes moved to Bootstrap 5.3.8 on
      # 2026-08-16 (#91); until then this entry read `>=5` and held the
      # move back, which was the point. Afterwards it silently held back
      # every 5.x patch as well — a stale rule is indistinguishable from
      # a deliberate freeze, and Bootstrap ships security fixes in
      # patches. 6 stays out because it is a migration, not an update.
      # reviewed: 2026-09-03
      - dependency-name: bootstrap
        versions: [">=6"]
      # TypeScript 7 is refused by typescript-eslint, which says so and
      # exits — so `yarn lint` produces no lint at all rather than
      # failing loudly. Tracked upstream as typescript-eslint#10940 and
      # here as issue #69.
      #
      # Listed here and not only in the issue because that was the gap:
      # the decision was written down where a human reads it and nowhere
      # a machine does, so Dependabot proposed TS 7 again on 2026-08-10
      # (PR #88), the frontend job failed, and the three bumps bundled
      # with it were held up by it. Remove this entry when 10940 closes.
      # reviewed: 2026-09-03
      - dependency-name: typescript
        versions: [">=7"]

  # ------------------------------------------------------------------
  # The actions themselves. A pinned action with a vulnerability is a
  # vulnerability in the pipeline that builds the release.
  # ------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
