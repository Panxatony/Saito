version = 1

exclude_patterns = [
  # Third-party code and build output — not ours to fix, only adds noise.
  "vendor/**",
  "webroot/**",
  # Per-plugin webroot: served JS/CSS assets and install-specific theme code
  # (e.g. the Macnemo/Bota themes, the SaitoSearch form init). These are
  # non-module scripts that use globals ($, _) loaded via <script> tags, so a
  # module analysis flags them (JS-0125 undeclared vars, JS-R1002, ...).
  # DeepSource's glob does not honour a mid-pattern wildcard, so the leading
  # `**/webroot/**` form is used, plus explicit per-plugin paths (no wildcard
  # before the trailing `**`, like the working `webroot/**`) as a guarantee.
  "**/webroot/**",
  "plugins/Bota/webroot/**",
  "plugins/Macnemo/webroot/**",
  "plugins/SaitoSearch/webroot/**",
  "plugins/Stopwatch/webroot/**",
  # Developer scaffolding, not shipped app code: an outdated PHP7 docker dev
  # environment and helper scripts. Not worth holding to production lint rules.
  "dev/*",
  "dev/**",
  # App config/bootstrap: framework context that uses bootstrap constants
  # (ROOT, DS, APP) defined at runtime, so a standalone analysis reports them
  # as undefined (PHP-W1038). Not app logic. Both `config/*` (direct files
  # like app.php/bootstrap.php) and `config/**` (nested, e.g. Migrations) —
  # DeepSource's `**` matches nested paths but not direct files.
  "config/*",
  "config/**",
  # CakePHP view templates: their variables are injected by the controller
  # via $this->set()/compact(), so the analyzer can't see the definitions and
  # reports every one as "used but not defined" (PHP-W1066). Not real bugs.
  "templates/**",
  "**/templates/**",
  # The same, per plugin — and spelled out for the same reason the per-plugin
  # `webroot` paths above are: `**/templates/**` does not take effect, exactly
  # as the note there predicts for a leading wildcard. Measured on 2026-09-04,
  # when the PHP check reported **372 introduced occurrences**: 326 of them
  # PHP-W1066 "Variable $this might not be defined" in plugin templates, 245 in
  # `plugins/Admin/templates` alone. One single finding in the whole set was
  # real (a method-name casing in BbcodeParser, fixed in the same commit).
  #
  # Why it looked like a sudden explosion rather than a standing condition: a
  # run only introduces them when the PHP analyzer actually runs, which is when
  # a commit touches a PHP file. A commit that touches none reports zero, so
  # the check flickers between 372 and 0 and the total appears to leap. Both
  # failing runs reported the identical 372 — the same set, not a growing pile.
  "plugins/Admin/templates/**",
  "plugins/Bookmarks/templates/**",
  "plugins/Feeds/templates/**",
  "plugins/ImageUploader/templates/**",
  "plugins/Installer/templates/**",
  "plugins/SaitoHelp/templates/**",
  "plugins/SaitoSearch/templates/**",
  "plugins/Sitemap/templates/**",
  # Plugin route files, for the reason `config/*` is excluded above: `$routes`
  # is handed in by the framework, so a standalone read calls it undefined.
  "plugins/*/config/*",
  "plugins/Admin/config/**",
  "plugins/Api/config/**",
  "plugins/BbcodeParser/config/**",
  "plugins/Bookmarks/config/**",
  "plugins/Feeds/config/**",
  "plugins/ImageUploader/config/**",
  "plugins/Macfix/config/**",
  "plugins/Macnemo/config/**",
  "plugins/SaitoHelp/config/**",
  "plugins/SaitoSearch/config/**",
  "plugins/Sitemap/config/**",
  # Frontend: analyse our own TypeScript source under frontend/src, but skip
  # dependencies and minified third-party libraries.
  "frontend/node_modules/**",
  "frontend/**/*.min.js",
  # Root build-tooling config (Node/CommonJS), not application source —
  # analysing it as ES-module code produces false positives (e.g. JS-0118 flags
  # the `'use strict'` that is correct in a CommonJS module). Named explicitly
  # because the glob `**` does not match direct root files.
  "Gruntfile.js",
  # eslint.config.mjs: the lint configuration itself. It is a genuine ES module
  # — `.mjs` says so and Node reads it that way — but DeepSource parses it as a
  # script and reports its first `import` as a syntax error (JS-0833, the same
  # finding frontend/src/exports.js is excluded for). Nothing about the file is
  # wrong, and there is no per-file parser setting to correct the reading.
  "eslint.config.mjs",
  # exports.js: the jQuery/underscore/Bootstrap globals the administration
  # backend needs. A .js entry among the .ts source, and DeepSource parses .js
  # as a script and errors on `import` (JS-0833).
  "frontend/src/exports.js",
]

test_patterns = [
  "tests/**",
  "plugins/*/tests/**",
]

[[analyzers]]
name = "php"
enabled = true

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  # Browser code: the htmx/Alpine islands, plus the admin globals.
  environment = ["browser"]
  # Everything still analysed here is ES-module source (the script-style theme
  # and build files are excluded above). Declared for correctness — note that
  # it does NOT silence JS-0067 (tried on 2026-07-26, the count stayed at 23),
  # so that rule still needs the dashboard ignore described below.
  module_system = "es-modules"
  dialect = "typescript"

# JS-0067 "Prefer not to declare variables in global scope" (22x in
# frontend/src/islands/htmxThreadList.ts, 1x in vite.config.ts) — a false
# positive, ignored repository-wide in the dashboard. DeepSource cannot switch a
# rule off from this file, so the evidence is kept here rather than in the UI.
# Checked on 2026-07-27, three ways:
#
#   1. Both files carry `import` statements, so they are ES modules and their
#      top level is module scope, not global.
#   2. Vite emits the entry as an IIFE (build.lib formats = ['iife']); the built
#      bundle starts with `(function(){"use strict";`. A declaration inside an
#      IIFE cannot reach the global object.
#   3. Measured on a running page: of the 27 top-level names, none exists on
#      `window`. The bundle sets exactly three globals, all deliberately —
#      `htmx`, `Alpine` and `onpopstate`.
#
# Setting `module_system` / `dialect` above did not change the verdict, so the
# rule flags top-level declarations regardless of module scope.
#
# JS-0067 count re-checked on 2026-07-28 after the island bundle was split into
# one module per feature: it grew from 23 to 38 occurrences across 11 files, for
# the same reason. Re-verified independently rather than trusting the older note:
#
#   1. 14 of the 16 files under frontend/src carry `import`/`export`, so their
#      top level is module scope.
#   2. vite.config.ts still builds `formats: ['iife']`, and the emitted bundle
#      begins `(function(){"use strict";` — nothing declared inside can reach the
#      global object.
#   3. The built bundle assigns exactly three names to `window`: `htmx`,
#      `Alpine` and `onpopstate`. All three are deliberate.
#
# JS-R1005 ("cyclomatic complexity higher than threshold") — spread over the
# island event handlers, rated "medium risk" at complexity 6 to 13. Not treated
# as defects. The worst of them (smartInsert.ts, the paste handler) is eighteen
# lines of guard clauses that return early; its score comes from counting those
# guards and one four-way `||`. Splitting such a function to satisfy a threshold
# buys a number and costs a reader.
#
# The condition below has been acted on once, which is the point of writing it
# down: `convertNode` in htmlToBbcode.ts reached 55 at "critical" risk on
# 2026-07-29 and was taken apart into four functions (highest now 14), verified
# against the old version over eighteen paste cases with identical output.
#
# Expect that to make the *count* go up, not down — and do not read that as a
# regression. Splitting one function into four turns one occurrence into four,
# so the total went 24 -> 26 while the worst case went 55 -> 14. DeepSource
# fails a check on newly introduced occurrences, so the two commits that did the
# splitting are marked failed; the next commit that adds none is green again.
# This metric counts functions over a threshold. It does not measure how bad
# they are, and it cannot tell a split from a regression.
#
# Revisit if something crosses into "high risk" or grows past ~15.
#
# That stance was narrowed once, on 2026-07-30. Five functions were split for
# this rule after the JavaScript check went red on them: three that 8.3.0 had
# just added (the pre-paint boot script, the settings scroll-spy, the draft
# discard handler) and the admin table's init() and apply(), reported again once
# the file was touched. Strictly, waiting would also have cleared the check —
# an occurrence is only "newly introduced" once. They were split anyway,
# because each was doing several separable jobs and reads better apart, not to
# move a number. That is the test to apply next time: split when the function
# is genuinely two functions, leave it when the score is just counting guard
# clauses. The fourteen other functions above the threshold were left alone.

# How JS-R1005 actually fails a check, learned the expensive way on 2026-08-02
# after two commits spent guessing. An occurrence's identity includes its
# *complexity value*, so changing a flagged function at all — even making it
# simpler — is booked as one occurrence resolved plus one introduced, and the
# check goes red on the introduction. Adding one branch to `urlToBbcode` (7 -> 8)
# turned it red; simplifying it to 6 kept it red for the same reason.
#
# So there are only three ways out, and "make it a bit better" is not one:
#   1. Get the function *below* the threshold, so no occurrence exists at all.
#      Reporting starts at 6, so 5 is the target, not "lower than before".
#   2. Suppress it at the call site with `skipcq: JS-R1005` and the reason.
#   3. Leave the check red deliberately.
#
# Do not diagnose this from the commit status, which says only "blocking issues
# or failing metrics found", and do not try to read the run page — it is a JS
# application and curl returns nothing useful. Ask the API, with the token in
# ~/deepsource.txt (personal, not in the repo):
#
#   curl -s -X POST https://api.deepsource.io/graphql/ \
#     -H "Authorization: Bearer $(cat ~/deepsource.txt)" \
#     -H 'Content-Type: application/json' \
#     -d '{"query":"query($u:UUID!){run(runUid:$u){checks(first:20){edges{node{
#          analyzer{shortcode} status summary{occurrencesIntroduced}
#          issues(first:100){edges{node{shortcode path beginLine title}}}}}}}}",
#          "variables":{"u":"<run-uid aus der target_url des Commit-Status>"}}'
#
# `summary.occurrencesIntroduced` is the number that decides the check. The
# issue list shows *all* occurrences, including long-standing ones that are not
# why it failed — reading that list as the cause is the trap.

# JS-0052 ("alert/confirm/prompt") is *not* a false positive and is therefore
# not ignored here: it is suppressed with a `skipcq` comment at the one call
# site, where the reason for accepting it can be read next to the code.

# Excluding a path does not retire what was already recorded for it. Learned on
# 2026-08-17, and worth knowing before anybody "fixes" the patterns above.
#
# The dashboard listed 44 active occurrences; ten of them sit in paths this file
# excludes — nine under `dev/` (excluded since 2026-07-05) and one in
# `eslint.config.mjs` (since 2026-07-30). Six weeks and dozens of runs did not
# clear them, and they never will: `exclude_patterns` stops the analyser from
# *looking*, and an occurrence is only resolved by a run that looks and no
# longer finds it. So they are orphans, not open work.
#
# Two consequences:
#   1. Do not read the dashboard total as the number of things to fix, and do
#      not conclude from a lingering entry that an exclude pattern is broken.
#      Check the path against the list above first.
#   2. Clearing them takes `suppressIssueOccurrence` against the API (or the
#      same action in the UI). Nothing in this repository can do it, which is
#      why it is written down here.
#
# The live remainder is what the notes above already describe: mostly JS-R1005
# in the island modules, plus a handful in `passkeys.ts` and the deliberate
# complexity of `htmxTwoFactor()`.
#
# PHP-W1076 on `recordingDispatcher()` in the Webhooks listener test was a false
# positive — the method is called four times in the same file — and is now
# suppressed at the declaration with `skipcq`, per the JS-0052 precedent above.
